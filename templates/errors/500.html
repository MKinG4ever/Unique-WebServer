<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <style>
        /* دقیقاً همان استایل دو صفحه قبلی */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "500";
            position: absolute;
            font-size: clamp(35rem, 70vw, 90rem);
            font-weight: 900;
            color: rgba(244, 67, 54, 0.04);
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
            letter-spacing: -0.05em;
        }

        .error-box {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: clamp(2.5rem, 6vw, 4.5rem) clamp(1.8rem, 5vw, 3.5rem);
            max-width: 520px;
            background: rgba(25, 25, 25, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(244, 67, 54, 0.12);
            box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.7),
            0 0 0 1px rgba(244, 67, 54, 0.08) inset;
        }

        h1 {
            font-size: clamp(7rem, 20vw, 13rem);
            font-weight: 900;
            color: #f44336;
            line-height: 0.82;
            letter-spacing: -0.06em;
            margin-bottom: 0.8rem;
        }

        .subtitle {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 500;
            margin-bottom: 1.4rem;
            opacity: 0.92;
        }

        .message {
            font-size: clamp(1.05rem, 3.5vw, 1.2rem);
            line-height: 1.55;
            opacity: 0.82;
            margin-bottom: 2.4rem;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            padding: 1rem 2.5rem;
            font-size: clamp(1.05rem, 3.2vw, 1.2rem);
            font-weight: 600;
            color: white;
            background: #f44336;
            border-radius: 14px;
            text-decoration: none;
            transition: all 0.28s ease;
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.35);
        }

        .home-link:hover {
            background: #d32f2f;
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(244, 67, 54, 0.5);
        }

        .home-link:active {
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .error-box {
                margin: 1.5rem;
                padding: 2.5rem 1.8rem;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
<div class="error-box">
    <h1>500</h1>
    <div class="subtitle">Internal Server Error</div>
    <p class="message">
        Something went wrong on our side.<br>
        The server encountered an unexpected condition.
    </p>
    <a href="../../index.html" class="home-link">← Back to Home</a>
</div>
</body>
</html>
